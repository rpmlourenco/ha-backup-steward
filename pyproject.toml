[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-backup-steward"
version = "0.1.4"
description = "Supervised L2/L3 backups and safe offline-disk lifecycle for Home Assistant OS"
requires-python = ">=3.14"
dependencies = ["aiohttp==3.14.5", "dbus-fast==3.1.2", "tzdata==2026.5"]

[tool.setuptools.packages.find]
where = ["backup_steward"]
include = ["steward*"]

[tool.setuptools.package-data]
steward = ["static/*"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
