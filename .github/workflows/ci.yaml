name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . ruff
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components backup_steward/steward
      - run: docker build -t ha-backup-steward:test backup_steward
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/workspace:ro"
          ghcr.io/home-assistant/home-assistant:2026.10.3
          python /workspace/tests/ha_smoke.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
