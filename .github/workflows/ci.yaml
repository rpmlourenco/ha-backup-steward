name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . ruff
      - run: ruff check .
      - run: docker build -t ha-backup-steward:test backup_steward
      - run: >-
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace
          -e PYTHONPATH=backup_steward ha-backup-steward:test
          python -B -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components backup_steward/steward
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/workspace:ro"
          ghcr.io/home-assistant/home-assistant:2026.10.3
          python /workspace/tests/ha_smoke.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install playwright==1.62.0
      - name: Select test browser
        run: |
          ui_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$ui_browser_path" ]; then
            echo "STEWARD_TEST_BROWSER=$ui_browser_path" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python tests/ui_connection.py
      - run: python tests/ui_restore.py
